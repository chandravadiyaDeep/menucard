name: MenuCard V1 Android quality and APK

on:
  push:
    branches: [main]
    tags:
      - "v*"
    paths:
      - "app/**"
      - ".github/workflows/android-release.yml"
  pull_request:
    branches: [main]
    paths:
      - "app/**"
      - ".github/workflows/android-release.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: menucard-android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality-and-build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      # Android Lint in the current Flutter/AGP toolchain uses Java 21 APIs.
      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Flutter stable
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Generate Android platform project
        working-directory: app
        run: |
          flutter create --platforms=android --org com.deepchandravadiya --project-name menucard .
          python3 tool/set_android_metadata.py

      - name: Install Flutter dependencies
        working-directory: app
        run: flutter pub get

      - name: Verify code formatting
        working-directory: app
        run: |
          dart format lib test
          dart format --output=none --set-exit-if-changed lib test

      - name: Run static analysis
        working-directory: app
        run: flutter analyze

      # Run repository and widget tests together; no test is silently optional.
      - name: Run complete Flutter test suite
        working-directory: app
        run: timeout 240s flutter test --reporter expanded

      - name: Verify owner code generator output
        run: |
          set -euo pipefail
          TMP_DIR="$(mktemp -d)"
          cp tools/generate_owner_codes.py "$TMP_DIR/"
          cd "$TMP_DIR"
          python3 generate_owner_codes.py
          python3 - <<'PY'
          import csv
          import json
          import zipfile
          from pathlib import Path

          ledger = list(csv.DictReader(Path("menucard-issuer-ledger.csv").open(encoding="utf-8")))
          assert len(ledger) == 100, f"expected 100 issued codes, got {len(ledger)}"
          codes = [row["access_code"] for row in ledger]
          assert len(set(codes)) == 100, "duplicate access code generated"
          assert all(len(code.replace("-", "")) == 15 for code in codes), "unexpected code length"
          with zipfile.ZipFile("menucard-personal-code-files.zip") as archive:
              names = archive.namelist()
              assert len(names) == 100, f"expected 100 personal files, got {len(names)}"
              for name in names:
                  payload = json.loads(archive.read(name))
                  assert payload["schema_version"] == 1 and isinstance(payload["code"], str)
                  assert "codes" not in payload, "individual file must not expose the full batch"
          print("Owner code generator checks passed: 100 unique personal code files.")
          PY

      - name: Check customer menu JavaScript syntax
        run: node --check app/assets/publish/assets/menu.js

      - name: Test customer menu renderer and search behavior
        run: node --test app/test/menu_renderer_test.cjs

      - name: Validate production signing secrets
        if: startsWith(github.ref, 'refs/tags/') && !endsWith(github.ref, '-test')
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          for name in ANDROID_KEYSTORE_BASE64 ANDROID_KEYSTORE_PASSWORD ANDROID_KEY_ALIAS ANDROID_KEY_PASSWORD; do
            if [ -z "${!name}" ]; then
              echo "::error::Missing required production signing secret: $name"
              exit 1
            fi
          done

      - name: Configure production signing
        if: startsWith(github.ref, 'refs/tags/')
        working-directory: app
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          echo "$ANDROID_KEYSTORE_BASE64" | base64 --decode > android/app/upload-keystore.jks
          cat > android/key.properties <<EOF
          storePassword=$ANDROID_KEYSTORE_PASSWORD
          keyPassword=$ANDROID_KEY_PASSWORD
          keyAlias=$ANDROID_KEY_ALIAS
          storeFile=upload-keystore.jks
          EOF
          python3 tool/configure_android_signing.py

      - name: Build release-mode APK
        working-directory: app
        run: flutter build apk --release

      - name: Verify APK exists and record checksum
        working-directory: app
        run: |
          set -euo pipefail
          APK="build/app/outputs/flutter-apk/app-release.apk"
          test -s "$APK"
          sha256sum "$APK" | tee build/app/outputs/flutter-apk/SHA256SUMS.txt

      - name: Upload APK candidate
        uses: actions/upload-artifact@v4
        with:
          name: menucard-v1-apk-${{ github.run_number }}
          path: |
            app/build/app/outputs/flutter-apk/app-release.apk
            app/build/app/outputs/flutter-apk/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 30

      - name: Publish signed production APK to GitHub Release
        if: startsWith(github.ref, 'refs/tags/') && !endsWith(github.ref, '-test')
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            app/build/app/outputs/flutter-apk/app-release.apk
            app/build/app/outputs/flutter-apk/SHA256SUMS.txt
      - name: Publish V1.1.3 Android test APK
        if: "${{ github.event_name == 'push' && github.ref == 'refs/heads/main' && contains(github.event.head_commit.message, 'release: MenuCard v1.1.3') }}"
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.1.3
          target_commitish: ${{ github.sha }}
          name: MenuCard V1.1.3 — Android test APK
          body: |
            MenuCard V1.1.3 Android test build.

            - Full offline customer menu preview, reachable from Home, My menu and Designs.
            - Preview uses the same bundled HTML/CSS/JavaScript renderer as the exported website.
            - Local item photos are embedded for offline preview; photo lookup is indexed to keep larger menus responsive.
            - Owner search covers translated item names, descriptions and categories.
            - Category and availability filters include a one-tap clear-all action.
            - Safer item deletion and two-decimal price input.
            - Simplified Publish tab: public HTTPS link to QR code, on-device PNG/PDF export and native sharing.

            This is a release-mode test APK signed with the default debug key because production signing secrets are not configured. It is intended for device testing, not Play Store distribution.
          files: |
            app/build/app/outputs/flutter-apk/app-release.apk
            app/build/app/outputs/flutter-apk/SHA256SUMS.txt
          make_latest: true

      # Test tags intentionally use the Android debug key; label them as test APKs.
      - name: Publish Android physical-testing APK
        if: startsWith(github.ref, 'refs/tags/') && endsWith(github.ref, '-test')
        uses: softprops/action-gh-release@v2
        with:
          name: MenuCard ${{ github.ref_name }} — physical testing build
          body: |
            MenuCard Android release-mode test APK for physical-device validation.

            This APK is signed with the default Android debug key because production signing secrets are not configured. It is for physical testing only and is not suitable for Play Store distribution or production updates.
          files: |
            app/build/app/outputs/flutter-apk/app-release.apk
            app/build/app/outputs/flutter-apk/SHA256SUMS.txt
          make_latest: true
