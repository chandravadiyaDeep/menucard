name: MenuCard Android verification and release

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  verify-and-build:
    name: Verify Flutter app and build APK
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install Flutter dependencies
        working-directory: app
        run: flutter pub get

      - name: Check Dart formatting
        working-directory: app
        run: dart format --output=none --set-exit-if-changed lib test

      - name: Run static analysis
        working-directory: app
        run: flutter analyze --fatal-infos

      - name: Run automated tests
        working-directory: app
        run: flutter test --reporter expanded

      - name: Check customer menu JavaScript syntax
        run: node --check app/assets/publish/assets/menu.js

      - name: Test customer menu renderer and search behavior
        run: node --test app/test/menu_renderer_test.cjs

      - name: Build release APK
        working-directory: app
        run: flutter build apk --release

      - name: Upload APK build artifact
        uses: actions/upload-artifact@v4
        with:
          name: menucard-v1.1.1-android
          path: app/build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
          retention-days: 30

  publish-release:
    name: Publish APK to GitHub Releases
    if: github.event_name == 'push' && contains(github.event.head_commit.message, 'release: MenuCard v1.1.1')
    needs: verify-and-build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download verified APK
        uses: actions/download-artifact@v4
        with:
          name: menucard-v1.1.1-android
          path: dist

      - name: Publish versioned Android release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.1.1
          target_commitish: ${{ github.sha }}
          name: MenuCard V1.1.1
          body: |
            MenuCard V1.1.1 for Android.

            - Full customer menu preview using the same bundled HTML/CSS/JavaScript renderer as website export.
            - Offline preview with local dish photos.
            - Menu search across translated dish names, descriptions and categories.
            - Availability and category filters.
            - Safer item deletion and improved price input.
          files: dist/app-release.apk
          make_latest: true
