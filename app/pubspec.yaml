name: menucard
description: Free offline-first digital menu manager for local shops.
publish_to: "none"
version: 1.1.2+4 # V1.1.2 preview, search, editor polish and regression coverage

environment:
  sdk: ">=3.11.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  material_ui: ^1.0.0
  archive: ^4.7.1
  cross_file: ^0.3.5+2
  file_picker: ^13.4.1
  image_picker: ^1.2.4
  intl: ^0.20.2
  path: ^1.9.1
  path_provider: ^2.1.6
  qr_flutter: ^4.1.0
  share_plus: ^13.3.1
  uuid: ^4.6.0
  webview_flutter: ^4.10.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/publish/index.html
    - assets/publish/assets/menu.css
    - assets/publish/assets/menu.js
