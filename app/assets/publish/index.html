<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f7f5ef">
  <meta name="description" content="View the latest menu from this local shop.">
  <title>Digital Menu</title>
  <link rel="stylesheet" href="assets/menu.css">
  <script src="assets/menu.js" defer></script>
</head>
<body>
  <main class="page">
    <header class="shop-header">
      <p class="eyebrow">DIGITAL MENU</p>
      <h1 id="shop-name">Loading menu…</h1>
      <p id="shop-description" class="shop-description"></p>
      <p id="shop-meta" class="shop-meta"></p>
      <label class="language-control">Language
        <select id="language-select" aria-label="Choose menu language"></select>
      </label>
    </header>
    <p id="menu-status" class="status" role="status" aria-live="polite">Loading the latest published menu…</p>
    <section id="menu-content"></section>
    <footer>Menu provided by the shop · Powered by MenuCard</footer>
  </main>
</body>
</html>
